<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validacion Formulario DOM</title>
</head>

<body>
    <h3>Validación formulario con DOM</h3>
    <form method="post" id="my-form">
        <label for="number" name="num">Ingrese su numero entre 10 y 20:</label>
        <input type="text" name="num">
        <input type="submit">
    </form>
</body>

</html>

<script>
    const MIN_VALUE = 10;
    const MAX_VALUE = 20;

    const formEl = document.querySelector('form');
    formEl.addEventListener('submit', (event) => {

        event.preventDefault()

        const form = event.target;

        const numeroUsuario = form.elements.num.value;

        if (isNaN(numeroUsuario)) {
            console.log("El valor no es un numero.");

        } else if (numeroUsuario > MIN_VALUE && numeroUsuario < MAX_VALUE) {
            console.log(`El numero es correcto y es:  ${numeroUsuario}`);
        } else {
            console.log(`El numero no está en el rango ${MIN_VALUE} - ${MAX_VALUE}`)
        }

    });
</script>
