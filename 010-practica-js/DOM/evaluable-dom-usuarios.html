<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Usuarios - DOM</title>
     <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px 20px;
        }
        th {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h2>Lista de Usuarios</h2>

    <table id="tablaUsuarios">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <tr>
                <td>Juan</td>
                <td>Pérez</td>
            </tr>
            <tr>
                <td>María</td>
                <td>García</td>
            </tr>
        </tbody>
    </table>

    <div class="form-container">
        <h3>Añadir Nuevo Usuario</h3>
        <form id="formularioUsuario">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <button type="submit">Añadir Usuario</button>
        </form>
    </div>

    <script>
        // 1. Obtener referencias al formulario y a la tabla
        const formulario = document.getElementById('formularioUsuario');
        const cuerpoTabla = document.getElementById('cuerpoTabla');

        // 2. Escuchar el evento de envío del formulario
        formulario.addEventListener('submit', function (event) {
            // Prevenir que la página se recargue
            event.preventDefault();

            // 3. Obtener los valores de los inputs
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;

            // 4. Crear la nueva fila (TR) y celdas (TD)
            const nuevaFila = document.createElement('tr');

            // 5. Crear el contenido de las celdas
            nuevaFila.innerHTML = `
                <td>${nombre}</td>
                <td>${apellido}</td>
            `;
            // 6. Añadir la fila al final del cuerpo de la tabla
            cuerpoTabla.appendChild(nuevaFila);

            // 7. Limpiar el formulario
            formulario.reset();
        });
    </script>

</body>

</html>
