<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alineacion horizontal.</title>
</head>
<body>
    <div>Esto es un div centrado alineado horizontal y verticalmente.</div>

    <style>
        div {
            margin-top: 20%;
            display: inline-block;
            border: 1px solid black;
            position: relative;
            text-align: center;
            top:50%;
            left: 35%;
            
        }
    </style>
</body>
</html>
