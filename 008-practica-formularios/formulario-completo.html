<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Mi Red Social</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="for-container">
        <strong>Datos Personales:</strong>
        <form action="registro.html" method="post">
            <div>
                <label for="name">Nombre completo:</label>
                <input type="text" id="name" name="name">
            </div>
            <div>
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" name="username">
            </div>

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="birthdate">Fecha de Nacimiento:</label>
                <input type="date" id="birthdate" name="birthdate">
            </div>
            <div>
                <label for="favorite_color">Color Favorito:</label>
                <input type="color" id="favorite_color" name="favorite_color">
            </div>

    </div>
    <div class="for-container">
       <strong>Seguridad:</strong>
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
        </div>
        <div>
            <label for="confirm_password">Confirmar Contraseña:</label>
            <input type="password" id="confirm_password" name="confirm_password">
        </div>

        <div class="for-container">
            <strong>Preferencias:</strong>
            <label for="gender">Género:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Masculino</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Femenino</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Prefiero no contestar</label>
        </div>
        <div>
            <strong>Hobbies:</strong> <br>

            <label for="hobby1">Deportes</label>
            <input type="checkbox" id="hobby1" name="hobbies" value="sports">
            <label for="hobby2">Música</label>
            <input type="checkbox" id="hobby2" name="hobbies" value="music">
            <label for="hobby3">Tecnología</label>
            <input type="checkbox" id="hobby3" name="hobbies" value="tecnologies">
            <label for="hobby4">Lectura</label>
            <input type="checkbox" id="hobby4" name="hobbies" value="reading">
            <label for="hobby5">Otros</label>
            <input type="checkbox" id="hobby5" name="hobbies" value="others">
        </div>

        <div class="for-container">
            <label for="city"><strong>Ciudad:</strong></label>
            <select id="city" name="city">
                <option value="madrid">Madrid</option>
                <option value="barcelona">Barcelona</option>
                <option value="valencia">Valencia</option>
                <option value="sevilla">Sevilla</option>
                <option value="other">Otra</option>
            </select>
        </div>
        <div class="for-container">
            <label for="about"><strong>Cuentanos algo sobre ti:</strong></label>
            <textarea id="about" name="about" rows="4" cols="50"></textarea>
        </div>
        <div class="button-container">
            <div class="send">
                <button type="submit" class="send">Enviar</button>
            </div>
            <div class="reset">
                <button type="reset" class="reset">Resetear</button>
            </div>
            </form>
        </div>
    </div>
</body>

</html>
