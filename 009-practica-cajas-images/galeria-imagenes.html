<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de fotos</title>
    <style>
        .container {
            display: flex;
            justify-content:space-around;
            flex-direction: row;
            background-color: rgb(96, 134, 99);
            border: 4px solid black;
            
        }

        .item {
            width: 200px;
            height: 200px;
            flex-shrink: 1;
            background-color: bisque;
            border: 3px solid violet;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            <img src="https://fastly.picsum.photos/id/671/200/200.jpg?hmac=F8KUqkSzkLxagDZW5rOEHLjzFVxRZWnkrFPvq2BlnhE" alt="Una imagen abstracta">
        </div>
        <div class="item">
            <img src="https://fastly.picsum.photos/id/671/200/200.jpg?hmac=F8KUqkSzkLxagDZW5rOEHLjzFVxRZWnkrFPvq2BlnhE" alt="Otra imagen abstracta">
        </div>
        <div class="item">
            <img src="https://fastly.picsum.photos/id/671/200/200.jpg?hmac=F8KUqkSzkLxagDZW5rOEHLjzFVxRZWnkrFPvq2BlnhE" alt="Otra imagen abstracta más">
        </div>
        <div class="item">
            <img src="https://fastly.picsum.photos/id/671/200/200.jpg?hmac=F8KUqkSzkLxagDZW5rOEHLjzFVxRZWnkrFPvq2BlnhE" alt="La última imagen abstracta">
        </div>

    </div>
</body>
</html>
